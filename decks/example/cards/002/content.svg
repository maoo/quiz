<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="297mm" version="1.1" viewBox="0 0 1109 1110" width="210mm">
  <defs/>
  <rect fill="#f5f5f5" height="1110" rx="277" ry="277" width="1109" x="0" y="0"/>
  <path d="M 832,0 L 1109,0 L 1109,277 Q 1054,55 832,0 Z" fill="#f5f5f5"/>
  <path d="M 832,1110 L 1109,1110 L 1109,833 Q 1054,1055 832,1110 Z" fill="#f5f5f5"/>
  <circle cx="554" cy="555" fill="#dcdcdc" r="166"/>
  <g dominant-baseline="middle" font-family="Arial" font-size="24" text-anchor="middle">
    <text x="554" y="555">¿Como acaban estos refranes?</text>
  </g>
  <text fill="white" font-family="Arial" font-size="12" x="40" y="-90">1. De tal palo,</text>
  <text fill="white" font-family="Arial" font-size="12" x="40" y="-80">2. Al mal tiempo,</text>
  <text fill="white" font-family="Arial" font-size="12" x="40" y="-70">3. No es oro</text>
  <text fill="white" font-family="Arial" font-size="12" x="40" y="-60">4. A la tercera</text>
  <text fill="white" font-family="Arial" font-size="12" x="40" y="-50">5. El habito</text>
  <text fill="white" font-family="Arial" font-size="12" x="40" y="-40">6. Mas vale tarde</text>
  <text fill="white" font-family="Arial" font-size="12" x="40" y="-30">7. Preguntando</text>
  <text fill="white" font-family="Arial" font-size="12" x="40" y="-20">8. Mucho ruido</text>
  <g dominant-baseline="middle" font-family="Arial" font-size="18" text-anchor="middle">
    <text x="554.0" y="263.0">De</text>
    <text x="554.0" y="293.0">tal palo,</text>
  </g>
  <g dominant-baseline="middle" font-family="Arial" font-size="16" text-anchor="middle">
    <text x="554.0" y="106.0">tal astilla</text>
  </g>
  <g dominant-baseline="middle" font-family="Arial" font-size="18" text-anchor="middle">
    <text x="749.8685783886737" y="344.13142161132635">Al</text>
    <text x="749.8685783886737" y="374.13142161132635">mal tiempo,</text>
  </g>
  <g dominant-baseline="middle" font-family="Arial" font-size="16" text-anchor="middle">
    <text x="871.4909447527598" y="237.5090552472402">buena cara</text>
  </g>
  <g dominant-baseline="middle" font-family="Arial" font-size="18" text-anchor="middle">
    <text x="831.0" y="540.0">No</text>
    <text x="831.0" y="570.0">es oro</text>
  </g>
  <g dominant-baseline="middle" font-family="Arial" font-size="16" text-anchor="middle">
    <text x="1003.0" y="555.0">todo lo que reluce</text>
  </g>
  <g dominant-baseline="middle" font-family="Arial" font-size="18" text-anchor="middle">
    <text x="749.8685783886737" y="735.8685783886737">A</text>
    <text x="749.8685783886737" y="765.8685783886737">la tercera</text>
  </g>
  <g dominant-baseline="middle" font-family="Arial" font-size="16" text-anchor="middle">
    <text x="871.4909447527598" y="872.4909447527598">va la vencida</text>
  </g>
  <g dominant-baseline="middle" font-family="Arial" font-size="18" text-anchor="middle">
    <text x="554.0" y="817.0">El</text>
    <text x="554.0" y="847.0">habito</text>
  </g>
  <g dominant-baseline="middle" font-family="Arial" font-size="16" text-anchor="middle">
    <text x="554.0" y="1004.0">no hace el monje</text>
  </g>
  <g dominant-baseline="middle" font-family="Arial" font-size="18" text-anchor="middle">
    <text x="358.13142161132635" y="735.8685783886737">Mas</text>
    <text x="358.13142161132635" y="765.8685783886737">vale tarde</text>
  </g>
  <g dominant-baseline="middle" font-family="Arial" font-size="16" text-anchor="middle">
    <text x="236.5090552472402" y="872.4909447527598">que nunca</text>
  </g>
  <g dominant-baseline="middle" font-family="Arial" font-size="18" text-anchor="middle">
    <text x="277.0" y="540.0"/>
    <text x="277.0" y="570.0">Preguntando</text>
  </g>
  <g dominant-baseline="middle" font-family="Arial" font-size="16" text-anchor="middle">
    <text x="105.0" y="555.0">se llega a Roma</text>
  </g>
  <g dominant-baseline="middle" font-family="Arial" font-size="18" text-anchor="middle">
    <text x="358.1314216113263" y="344.13142161132635">Mucho</text>
    <text x="358.1314216113263" y="374.13142161132635">ruido</text>
  </g>
  <g dominant-baseline="middle" font-family="Arial" font-size="16" text-anchor="middle">
    <text x="236.5090552472401" y="237.5090552472402">y pocas nueces</text>
  </g>
</svg>
