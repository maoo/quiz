type: object
properties:
  card_id:
    type: string
    minLength: 1
  question_type:
    type: string
    enum: [short, extended]
    minLength: 1
  question_content:
    type: string
    minLength: 1
  embedded_contents:
    type: array
    items:
      type: object
      properties:
        type: {type: string, enum: [image, table, iframe, link], minLength: 1}
        url: {type: string, format: uri, minLength: 1}
        description: {type: string, minLength: 1}
        headers: {type: array, items: {type: string, minLength: 1}}
        rows: {type: array, items: {type: array, items: {type: string, minLength: 1}}}
        table: {type: string, minLength: 1}
  options:
    type: array
    items: 
      type: string
      minLength: 1
    minItems: 10
    maxItems: 10
  sources:
    type: array
    items: 
      type: string
      minLength: 1
  url:
    type: string
    format: uri
    minLength: 1
  answer_type:
    type: string
    enum: [binary, ordering_number, date, free_text]
    minLength: 1
required: [card_id, question_type, question_content, options, sources, url, answer_type]